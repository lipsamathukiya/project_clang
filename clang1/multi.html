<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi Utility Program</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background-color: #0f172a;
            font-family: Arial, sans-serif;
            color: white;
        }

        header {
            background-color: #111c32;
            padding: 30px 0;
            text-align: center;
        }

        .header-title {
            font-size: 40px;
            font-weight: bold;
            margin: 0;
            color: white;
        }

        .header-subtitle {
            color: #94a3b8;
            margin-top: 8px;
            margin-bottom: 0;
        }

        .program-card {
            background-color: #111c32;
            border: 1px solid #0879ff;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            height: 260px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: 0.3s;
        }

        .program-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 121, 255, 0.25);
        }

        .icon-box {
            width: 65px;
            height: 65px;
            background-color: #0b1930;
            border: 1px solid #0879ff;
            border-radius: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 15px;
        }

        .icon-box i {
            font-size: 30px;
            color: #00d9ff;
        }

        .program-card h3 {
            color: #60a5fa;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .program-card p {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .btn-custom {
            background-color: #0879ff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 9px 22px;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-custom:hover {
            background-color: #0879ff;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <h1 class="header-title">Multi Utility Program</h1>

            <p class="header-subtitle">
                Click The Button To View Programs
            </p>
        </div>
    </header>


    <div class="container mt-5">

        <div class="row g-4 justify-content-center">

            <!-- Program 1 -->
            <div class="col-lg-6 col-md-6">
                <div class="program-card">

                    <div class="icon-box">
                        <i class="fa-solid fa-temperature-half"></i>
                    </div>

                    <h3>Program 1</h3>

                    <p>Temperature Converter</p>

                    <a href="TEMPERAT.CPP" class="btn-custom">
                        View Program
                    </a>

                </div>
            </div>


            <!-- Program 2 -->
            <div class="col-lg-6 col-md-6">
                <div class="program-card">

                    <div class="icon-box">
                        <i class="fa-solid fa-money-bill-wave"></i>
                    </div>

                    <h3>Program 2</h3>

                    <p>Gross Salary Calculator</p>

                    <a href="SALARY.CPP" class="btn-custom">
                        View Program
                    </a>

                </div>
            </div>


            <!-- Program 3 -->
            <div class="col-lg-6 col-md-6">
                <div class="program-card">

                    <div class="icon-box">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>

                    <h3>Program 3</h3>

                    <p>Triangle Angle Finder</p>

                    <a href="TRIANGLE.CPP" class="btn-custom">
                        View Program
                    </a>

                </div>
            </div>

        </div>

    </div>

</body>

</html>
