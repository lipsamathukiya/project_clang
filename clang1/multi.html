<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Utility Program</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#1a1a1a;
    font-family:Arial,sans-serif;
}

/* Header */
header{
    background:linear-gradient(135deg,#ff4da6,#d63384);
    color:white;
    padding:25px 0;
    box-shadow:0 4px 12px rgba(214,51,132,0.3);
}

.header-title{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    margin:0;
}

.header-subtitle{
    text-align:center;
    color:#ffe6f2;
    margin-top:8px;
    font-size:16px;
}

/* Cards */
.program-card{
    height:250px;
    background:#2d2d2d;
    border:1px solid #ff80bf;
    border-radius:20px;
    text-align:center;
    padding:25px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:0.3s;

    box-shadow:0 6px 15px rgba(0,0,0,0.3);
}

.program-card:hover{
    transform:translateY(-8px);
    box-shadow:0 8px 20px rgba(255,77,166,0.3);
}

.program-card h3{
    color:#ff80bf;
    font-weight:bold;
    margin-bottom:15px;
}

.program-card p{
    color:#f1f1f1;
    margin-bottom:25px;
}

/* Button */
.btn-custom{
    background:#ff4da6;
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 20px;
    font-weight:600;
    text-decoration:none;
    display:inline-block;

    box-shadow:0 4px 10px rgba(255,77,166,0.3);
}

.btn-custom:hover{
    background:#e60073;
    color:white;
    transform:translateY(-2px);
}


</style>
</head>

<body>

<!-- Header -->
<header>
    <div class="container">
        <h1 class="header-title">Multi Utility Program</h1>
        <p class="header-subtitle">
            Click The Button To View Programs
        </p>
    </div>
</header>

<div class="container mt-5">

    <div class="row g-4 justify-content-center">

        <!-- Program 1 -->
        <div class="col-md-6">
            <div class="program-card">

                <h3>Program 1</h3>

                <p>Temperature Converter</p>

                <a href="temperat.cpp" class="btn-custom">
                    View Program
                </a>

            </div>
        </div>

        <!-- Program 2 -->
        <div class="col-md-6">
            <div class="program-card">

                <h3>Program 2</h3>

                <p>Gross Salary Calculator</p>

                <a href="salary.cpp" class="btn-custom">
                    View Program
                </a>

            </div>
        </div>

        <!-- Program 3 -->
        <div class="col-md-6">
            <div class="program-card">

                <h3>Program 3</h3>

                <p>Triangle Angle Finder</p>

                <a href="triangle.cpp" class="btn-custom">
                    View Program
                </a>

            </div>
        </div>

    </div>

</div>



</body>
</html>
