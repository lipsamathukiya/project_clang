<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Program</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    font-family:Arial,sans-serif;
}

header{
    background:linear-gradient(135deg,#0b1f3a,#163b68);
    color:white;
    padding:25px 0;
    box-shadow:0 5px 20px rgba(11,31,58,0.5);
}

.header-title{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin:0;
    color:white;
}

.header-subtitle{
    text-align:center;
    color:#dbeafe;
    margin-top:8px;
    font-size:16px;
}

.program-card{
    background:#172554;
    border:2px solid #1e4b7a;
    border-radius:20px;
    padding:25px;
    text-align:center;
    height:220px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:0.4s;
    box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.program-card:hover{
    transform:translateY(-8px);
    box-shadow:
    0 0 20px rgba(30,75,122,0.6),
    0 0 35px rgba(30,75,122,0.4);
}

.program-card h3{
    color:#60a5fa;
    font-weight:bold;
    margin-bottom:15px;
}

.program-card p{
    color:#dbeafe;
    margin-bottom:25px;
}

.btn-custom{
    background:linear-gradient(135deg,#0b1f3a,#163b68);
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 20px;
    font-weight:600;
    text-decoration:none;
    display:inline-block;
    transition:0.3s;
}

.btn-custom:hover{
    background:linear-gradient(135deg,#163b68,#2563a6);
    color:white;
    transform:translateY(-2px);
}

.video-box{
    background:#172554;
    border:2px solid #1e4b7a;
    border-radius:20px;
    padding:25px;
    margin-top:50px;
    box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.video-title{
    text-align:center;
    color:#60a5fa;
    margin-bottom:20px;
    font-weight:bold;
}

video{
    width:100%;
    border-radius:12px;
    border:2px solid #1e4b7a;
}
</style>
</head>

<body>

<!-- Header -->
<header>
    <div class="container">
        <h1 class="header-title">Calculator Program</h1>
        <p class="header-subtitle">
            Click The Button To View Programs
        </p>
    </div>
</header>

<div class="container mt-5">

    <div class="row g-4 justify-content-center">

        <!-- Program 1 -->
        <div class="col-md-6">
            <div class="program-card">

                <h3>Program 1</h3>

                <p>Temperature Converter</p>

                <a href="CALC.CPP" class="btn-custom">
                    View Program
                </a>

            </div>
        </div>
    </div>
    <div class="video-box">

        <h2 class="video-title">
            Filament Program Demonstration Video
        </h2>

        <video controls>
            <source src="screen-capture (2).webm" type="video/mp4">
        </video>

    </div>


</div>


</body>
</html>
